<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #13171f; }
      .muted { fill: #667085; }
      .blue { fill: #1c4fc2; }
      .tiny { font-size: 11px; font-weight: 650; }
      .small { font-size: 12px; }
      .body { font-size: 13px; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: .4px; }
      .h2 { font-size: 28px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#f7f8fa"/>
  <rect width="1440" height="72" fill="#fff" stroke="#dde1e7"/>
  <text x="28" y="42" font-size="15" font-weight="750">WORD FORGE</text>
  <text x="232" y="30" font-size="15" font-weight="650">The Glass Orchard</text>
  <text x="232" y="50" class="small muted">Science fiction novel</text>
  <text x="1255" y="39" class="small muted">Saved just now</text>

  <rect y="72" width="220" height="888" fill="#fff" stroke="#dde1e7"/>
  <text x="24" y="111" class="label muted">WORKSPACE</text>
  <text x="24" y="158" class="body">Overview</text>
  <rect x="12" y="174" width="196" height="40" rx="6" fill="#ebf2ff"/>
  <text x="24" y="199" class="body blue" font-weight="650">World</text>
  <text x="24" y="246" class="body">Characters</text>
  <text x="24" y="294" class="body">Plot</text>
  <text x="24" y="342" class="body">Chapters</text>
  <text x="24" y="420" class="label muted">PREWRITING COVERAGE</text>
  <text x="24" y="458" font-size="28" font-weight="750">62%</text>
  <rect x="24" y="478" width="172" height="6" rx="3" fill="#e2e6ec"/>
  <rect x="24" y="478" width="107" height="6" rx="3" fill="#1c4fc2"/>

  <text x="252" y="119" class="body blue" font-weight="650">‹  World</text>
  <text x="252" y="164" class="h2">Memory grafting</text>
  <text x="252" y="193" class="small muted">Technology  ·  Updated 6 minutes ago</text>
  <rect x="930" y="140" width="178" height="40" rx="6" fill="#e8f6ee" stroke="#68b483"/>
  <text x="982" y="165" class="body" fill="#176b3d" font-weight="650">✓  Canon</text>

  <g opacity=".48">
    <rect x="252" y="230" width="416" height="128" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="268" y="258" class="label muted">OVERVIEW</text>
    <text x="268" y="292" class="body">Licensed memories can be installed, inherited,</text>
    <text x="268" y="312" class="body">or removed under strict state control.</text>
    <text x="268" y="342" class="tiny muted">AI ACCEPTED</text>
    <rect x="692" y="230" width="416" height="128" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="708" y="258" class="label muted">CORE RULE</text>
    <text x="708" y="292" class="body">A graft adds knowledge, but not the original</text>
    <text x="708" y="312" class="body">owner's emotional context.</text>
    <text x="708" y="342" class="tiny blue">HUMAN AUTHORED</text>
    <rect x="252" y="382" width="416" height="128" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="268" y="410" class="label muted">COST</text>
    <text x="268" y="444" class="body">Every graft displaces an autobiographical memory</text>
    <text x="268" y="464" class="body">of comparable emotional weight.</text>
    <text x="268" y="494" class="tiny muted">AI SUGGESTION PENDING</text>
    <rect x="692" y="382" width="416" height="128" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="708" y="410" class="label muted">STORY PRESSURE</text>
    <text x="708" y="444" class="body">The ruling council hoards recovered founder</text>
    <text x="708" y="464" class="body">memories to justify its authority.</text>
    <text x="708" y="494" class="tiny blue">HUMAN AUTHORED</text>
  </g>

  <rect x="1140" y="72" width="300" height="888" fill="#fff" stroke="#dde1e7" opacity=".48"/>
  <text x="1160" y="116" class="h3" opacity=".48">Forge assistant</text>
  <text x="1160" y="155" class="small blue" opacity=".48">Context: Memory grafting</text>

  <rect x="0" y="72" width="1440" height="888" fill="#111827" opacity=".16"/>
  <g filter="url(#shadow)">
    <rect x="438" y="170" width="564" height="620" rx="10" fill="#fff"/>
  </g>
  <text x="470" y="217" font-size="20" font-weight="700">Review AI suggestion</text>
  <text x="470" y="245" class="small muted">Memory grafting  /  Cost</text>
  <rect x="946" y="195" width="32" height="32" rx="6" fill="#f1f3f6"/>
  <path d="M956 205l12 12m0-12l-12 12" stroke="#384152" stroke-width="2" stroke-linecap="round"/>

  <text x="470" y="292" class="label muted">PROPOSED TEXT</text>
  <rect x="470" y="310" width="500" height="126" rx="8" fill="#f3f4f6" stroke="#d7dbe2"/>
  <text x="490" y="342" class="body">Every graft displaces an autobiographical memory of</text>
  <text x="490" y="365" class="body">comparable emotional weight. The displaced memory can</text>
  <text x="490" y="388" class="body">be archived, but never restored without loss.</text>
  <rect x="490" y="405" width="82" height="21" rx="10" fill="#e4e7ec"/>
  <text x="504" y="420" class="tiny muted">AI PENDING</text>

  <text x="470" y="481" class="label muted">REQUEST A REVISION</text>
  <rect x="470" y="500" width="500" height="98" rx="8" fill="#fff" stroke="#aeb6c3"/>
  <text x="488" y="532" class="body muted">Enter a revision...</text>
  <text x="488" y="580" class="tiny muted">The current suggestion stays inactive while a replacement is generated.</text>

  <rect x="470" y="626" width="154" height="42" rx="6" fill="#fff" stroke="#c8ced8"/>
  <path d="M490 640a8 8 0 1 0 5 14m0 0v-6m0 6h-6" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="514" y="652" class="body muted" font-weight="650">Revise</text>
  <rect x="636" y="626" width="154" height="42" rx="6" fill="#fff" stroke="#c8ced8"/>
  <path d="M656 641l12 12m0-12l-12 12" stroke="#9b2c2c" stroke-width="2" stroke-linecap="round"/>
  <text x="680" y="652" class="body" fill="#9b2c2c" font-weight="650">Reject</text>
  <rect x="802" y="626" width="168" height="42" rx="6" fill="#1c4fc2"/>
  <path d="M824 647l6 6 12-14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="852" y="652" class="body" fill="#fff" font-weight="650">Accept as canon</text>

  <line x1="470" y1="706" x2="970" y2="706" stroke="#e0e3e8"/>
  <text x="470" y="738" class="small muted">Acceptance records AI provenance. Later human edits remain attributed.</text>
</svg>
