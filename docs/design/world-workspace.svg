<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #13171f; }
    .muted { fill:#667085; } .blue { fill:#1c4fc2; }
    .tiny { font-size:11px; font-weight:650; } .small { font-size:12px; }
    .body { font-size:13px; } .label { font-size:11px; font-weight:700; letter-spacing:.4px; }
    .h2 { font-size:28px; font-weight:700; } .h3 { font-size:16px; font-weight:650; }
  </style>
  <rect width="1440" height="960" fill="#f7f8fa"/>
  <rect width="1440" height="72" fill="#fff" stroke="#dde1e7"/>
  <text x="28" y="42" font-size="15" font-weight="750">WORD FORGE</text>
  <text x="232" y="30" font-size="15" font-weight="650">The Glass Orchard</text>
  <text x="232" y="50" class="small muted">Science fiction novel</text>
  <text x="1255" y="39" class="small muted">Saved just now</text>

  <rect y="72" width="220" height="888" fill="#fff" stroke="#dde1e7"/>
  <text x="24" y="111" class="label muted">STORY STAGES</text>
  <circle cx="190" cy="151" r="10" fill="#e7f5ec"/><text x="186" y="155" class="tiny" fill="#176b3d">✓</text>
  <text x="24" y="156" class="body">Overview</text>
  <text x="24" y="175" class="tiny muted">Complete</text>
  <rect x="12" y="192" width="196" height="54" rx="6" fill="#ebf2ff"/>
  <text x="24" y="216" class="body blue" font-weight="650">World</text>
  <text x="24" y="235" class="tiny blue">Stage 2 of 4</text>

  <path d="M181 281v-5a6 6 0 0 1 12 0v5m-14 0h16v13h-16z" fill="none" stroke="#8c94a1" stroke-width="1.6"/>
  <text x="24" y="287" class="body muted">Characters</text>
  <text x="24" y="306" class="tiny muted">Finish World to unlock</text>
  <path d="M181 349v-5a6 6 0 0 1 12 0v5m-14 0h16v13h-16z" fill="none" stroke="#8c94a1" stroke-width="1.6"/>
  <text x="24" y="355" class="body muted">Plot</text>
  <text x="24" y="374" class="tiny muted">Unlocks with Characters</text>
  <path d="M181 417v-5a6 6 0 0 1 12 0v5m-14 0h16v13h-16z" fill="none" stroke="#8c94a1" stroke-width="1.6"/>
  <text x="24" y="423" class="body muted">Chapters</text>
  <text x="24" y="442" class="tiny muted">Finish Characters + Plot</text>

  <text x="24" y="520" class="label muted">WORLD COVERAGE</text>
  <text x="24" y="558" font-size="28" font-weight="750">67%</text>
  <rect x="24" y="578" width="172" height="6" rx="3" fill="#e2e6ec"/>
  <rect x="24" y="578" width="115" height="6" rx="3" fill="#1c4fc2"/>
  <text x="24" y="616" class="small muted">4 of 6 required elements</text>
  <text x="24" y="635" class="small muted">contain accepted canon.</text>

  <text x="252" y="126" class="h2">World</text>
  <text x="252" y="157" class="body muted">Define the rules, places, and cultures that later stages can rely on.</text>
  <rect x="918" y="108" width="190" height="42" rx="6" fill="#eef0f3"/>
  <text x="948" y="134" class="body muted" font-weight="650">Complete world stage</text>
  <text x="918" y="169" class="tiny muted">Complete 2 more required elements</text>

  <text x="252" y="216" class="label muted">SCIENCE FICTION TEMPLATE</text>
  <rect x="252" y="232" width="112" height="25" rx="12" fill="#e9efff"/><text x="269" y="249" class="tiny blue">FOUNDATIONS</text>
  <rect x="374" y="232" width="108" height="25" rx="12" fill="#eef0f3"/><text x="392" y="249" class="tiny muted">3 CUSTOM</text>
  <text x="252" y="304" class="h3">Foundation</text>
  <text x="252" y="328" class="small muted">Open a card to edit its fields.</text>

  <g>
    <rect x="252" y="352" width="416" height="166" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="272" y="382" class="h3">The Glass Orchard</text>
    <path d="M632 371l8-8 7 7-8 8-10 3z" fill="none" stroke="#667085" stroke-width="1.5"/>
    <rect x="272" y="398" width="65" height="23" rx="11" fill="#eef0f3"/><text x="285" y="414" class="tiny muted">LOCATION</text>
    <rect x="347" y="398" width="55" height="23" rx="11" fill="#e7f5ec"/><text x="360" y="414" class="tiny" fill="#176b3d">CANON</text>
    <text x="272" y="455" class="body muted">An orbital habitat grown from engineered silica trees.</text>
    <text x="272" y="495" class="tiny blue">HUMAN AUTHORED</text>
  </g>
  <g>
    <rect x="692" y="352" width="416" height="166" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="712" y="382" class="h3">Memory grafting</text>
    <path d="M1072 371l8-8 7 7-8 8-10 3z" fill="none" stroke="#667085" stroke-width="1.5"/>
    <rect x="712" y="398" width="82" height="23" rx="11" fill="#eef0f3"/><text x="725" y="414" class="tiny muted">TECHNOLOGY</text>
    <rect x="804" y="398" width="55" height="23" rx="11" fill="#e7f5ec"/><text x="817" y="414" class="tiny" fill="#176b3d">CANON</text>
    <text x="712" y="455" class="body muted">Licensed memories are traded, inherited, and sometimes stolen.</text>
    <text x="712" y="495" class="tiny muted">AI ACCEPTED</text>
  </g>
  <g>
    <rect x="252" y="542" width="416" height="166" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="272" y="572" class="h3">The Keepers</text>
    <path d="M632 561l8-8 7 7-8 8-10 3z" fill="none" stroke="#667085" stroke-width="1.5"/>
    <rect x="272" y="588" width="58" height="23" rx="11" fill="#eef0f3"/><text x="285" y="604" class="tiny muted">FACTION</text>
    <rect x="340" y="588" width="55" height="23" rx="11" fill="#fff1c2"/><text x="353" y="604" class="tiny" fill="#805500">SKETCH</text>
    <text x="272" y="645" class="body muted">Archivists who believe unaltered memory is a civic right.</text>
    <text x="272" y="685" class="tiny blue">HUMAN AUTHORED</text>
  </g>
  <g>
    <rect x="692" y="542" width="416" height="166" rx="8" fill="#fff" stroke="#d9dee6"/>
    <text x="712" y="572" class="h3">Nonhuman life</text>
    <path d="M1072 561l8-8 7 7-8 8-10 3z" fill="none" stroke="#667085" stroke-width="1.5"/>
    <rect x="712" y="588" width="60" height="23" rx="11" fill="#eef0f3"/><text x="725" y="604" class="tiny muted">SPECIES</text>
    <rect x="782" y="588" width="55" height="23" rx="11" fill="#fff1c2"/><text x="795" y="604" class="tiny" fill="#805500">SKETCH</text>
    <text x="712" y="645" class="body muted">No accepted definition yet.</text>
    <text x="712" y="685" class="tiny muted">NEEDS INPUT</text>
  </g>

  <text x="252" y="760" class="h3">Recommended next</text>
  <rect x="252" y="780" width="856" height="78" rx="8" fill="#fff7dd" stroke="#dfb943"/>
  <text x="272" y="811" class="body" font-weight="650">Define the cost of memory grafting</text>
  <text x="272" y="835" class="small muted">Two more accepted foundations will enable the next stage.</text>

  <rect x="1140" y="72" width="300" height="888" fill="#fff" stroke="#dde1e7"/>
  <text x="1160" y="116" class="h3">Forge assistant</text>
  <rect x="1160" y="136" width="112" height="24" rx="12" fill="#e9efff"/><text x="1175" y="153" class="tiny blue">CONTEXT: WORLD</text>
  <text x="1160" y="198" class="small muted">I’m using only this stage. Open a card</text>
  <text x="1160" y="217" class="small muted">to narrow my context to that element.</text>
  <rect x="1160" y="248" width="260" height="106" rx="8" fill="#f2f4f7"/>
  <text x="1176" y="278" class="body">The strongest gap is what memory</text>
  <text x="1176" y="300" class="body">alteration costs a person or society.</text>
  <rect x="1160" y="866" width="260" height="68" rx="8" fill="#fff" stroke="#bfc6d1"/>
  <text x="1176" y="906" class="body muted">Ask about this stage…</text>
</svg>
