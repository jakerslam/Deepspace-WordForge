<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="slate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/Deepspace-WordForge/favicon.ico" />
    <title>Word Forge</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>html{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background-color:#0a0a0a}html[data-theme=paper]{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;background-color:#fff}</style>
    <!-- Pre-paint theme boot: honor the sidebar ThemeToggle's persisted
         choice (localStorage['ui-theme']) before the first frame, so
         reloads don't flash the default theme. -->
    <script>
      try {
        var t = localStorage.getItem('ui-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch (e) { /* private mode — keep the default */ }
    </script>
    <script type="module" crossorigin src="/Deepspace-WordForge/assets/index-jjiMAFGd.js"></script>
    <link rel="modulepreload" crossorigin href="/Deepspace-WordForge/assets/jsx-runtime-D3jfb0Ew.js">
    <link rel="stylesheet" crossorigin href="/Deepspace-WordForge/assets/index-anbYQNtg.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
